name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/MicSomeNoise.Checks -c Release
      - shell: pwsh
        run: ./scripts/publish.ps1 -SelfContained
      - uses: actions/upload-artifact@v4
        with:
          name: MicSomeNoise-win-x64
          path: artifacts/MicSomeNoise-win-x64.zip
