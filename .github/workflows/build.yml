name: Windows checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/**', 'global.json', 'NuGet.Config', 'Directory.*']
  pull_request:
    paths: ['src/**', 'tests/**', 'scripts/**', '.github/workflows/**', 'global.json', 'NuGet.Config', 'Directory.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/MicSomeNoise.Checks -c Release
      - run: dotnet build src/MicSomeNoise -c Release
